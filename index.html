<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyNexify - Secure Tech Redirector</title>
    <!-- ExoClick Ad Provider Script -->
    <script async type="application/javascript" src="https://a.pemsrv.com/ad-provider.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
            margin-bottom: 70px;
            text-align: center;
        }
        .ad-container {
            width: 100%;
            margin: 15px 0;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
        .header-title {
            font-size: 1.25rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .guide-box {
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid var(--border-color);
        }
        .guide-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #34d399;
        }
        .guide-box p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .redirect-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 20px;
        }
        .redirect-btn:hover {
            background-color: var(--accent-hover);
        }
        .redirect-btn:active {
            transform: scale(0.98);
        }
        .redirect-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        .timer-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }
        /* Sticky Footer Ad */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            z-index: 1000;
            min-height: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Ad Banner (Zone ID 6094888) -->
        <div class="ad-container">
            <ins class="eas6a97888e33" data-zoneid="6094888"></ins>
            <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
        </div>

        <div class="header-title">MyNexify Tech Hub</div>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 15px;">AI, Software & Cybersecurity Guide 2026</p>

        <!-- Professional Tech Guide Section -->
        <div class="guide-box">
            <h3>🛡️ Secure Telegram Redirection</h3>
            <p>Your requested secure destination link is being prepared. Please verify the connection below to proceed safely to your Telegram channel or bot asset.</p>
        </div>

        <!-- Middle Ad Banner (Zone ID 6070626) -->
        <div class="ad-container">
            <ins class="eas6a97888e33" data-zoneid="6070626"></ins>
            <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
        </div>

        <!-- Action Button & Timer -->
        <button id="actionBtn" class="redirect-btn" onclick="handleRedirectClick()">Please Wait (7s)</button>
        <div id="timerText" class="timer-text">Complete the verification to unlock your link.</div>
    </div>

    <!-- Sticky Footer Ad (Zone ID 6058644) -->
    <div class="sticky-footer">
        <ins class="eas6a97888e33" data-zoneid="6058644"></ins>
        <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
    </div>

    <script>
        let countdown = 7;
        const btn = document.getElementById('actionBtn');
        const timerText = document.getElementById('timerText');
        
        // Extract target URL from base64 query parameter ?url=...
        function getTargetUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedUrl = urlParams.get('url');
            if (!encodedUrl) return "https://t.me/"; // Default fallback
            try {
                return atob(encodedUrl);
            } catch (e) {
                return "https://t.me/";
            }
        }

        let targetUrl = getTargetUrl();
        let isReady = false;

        // Start countdown timer automatically on load
        const timerInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                btn.innerText = `Please Wait (${countdown}s)`;
            } else {
                clearInterval(timerInterval);
                isReady = true;
                btn.innerText = "Click Here to Continue 🚀";
                timerText.innerText = "Link is ready! Click the button above.";
            }
        }, 1000);

        function handleRedirectClick() {
            if (!isReady) return;
            // Trigger redirection to target base64 decoded url
            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
